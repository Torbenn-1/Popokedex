<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donate — Popokedex</title>
  <script>
    (() => {
      const v = localStorage.getItem("popo_theme");
      const dark =
        v === "dark" ||
        (v !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="../css/app.css">
  <script type="module" src="../js/pages/donate.js"></script>
</head>
<body>
  <div class="wrap">
    <header data-shell-header></header>
    <section class="donate-page">
      <h1 class="page-title" data-i18n="donate_title"></h1>
      <p class="donate-lead" data-i18n="donate_lead"></p>
      <div class="donate-card panel">
        <h2 data-i18n="donate_soon_title"></h2>
        <p class="muted" data-i18n="donate_soon_body"></p>
      </div>
    </section>
  </div>
  <footer data-shell-footer></footer>
</body>
</html>
